# Alembic configuration for the application database.
#
# The database URL is NOT set here: backend/db/migrations/env.py takes it
# from config.DATABASE_URL, so the app, the migrations and the seed script
# always point at the same database (SQLite under data/ by default,
# PostgreSQL when DATABASE_URL says so).
#
# From the repository root:
#   alembic upgrade head        apply every migration
#   alembic check               fail if models.py and the migrations differ
#   alembic revision --autogenerate -m "describe the change"
# The app also runs "upgrade head" itself at startup (backend/db/migrate.py).

[alembic]
script_location = %(here)s/backend/db/migrations
# backend/ holds the modules env.py imports by bare name (config, db.base).
prepend_sys_path = %(here)s/backend
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
