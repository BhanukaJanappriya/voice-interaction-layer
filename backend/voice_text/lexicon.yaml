# Data for backend/voice_text/normalizer.py. Everything that is a word or a name lives here;
# the algorithms (number to words for English, date and time shapes) live in the code.
#
# Choices (also in docs/VOICE_EVAL.md):
# * English numbers are spoken as English words ("four thousand five hundred ninety").
# * Sinhala and Tamil: number to words is NOT implemented. The joining forms of Sinhala
#   (visi, tis, hathalis) and Tamil (irupaththu, mupparhu) numbers are irregular and a wrong
#   numeral is worse than a digit. Integers stay as Arabic digits without thousands commas, the
#   TTS voice reads them. Phone numbers, short codes, OTPs, account numbers and decimal
#   fractions are spelled digit by digit with the digit words below (those are simple and certain).
# * Latin abbreviations and English telecom words inside si and ta sentences are rewritten into
#   the native script (a spelling the voice can read), because a Sinhala or Tamil voice often
#   reads Latin text in a flat or wrong way. Spellings are UNVERIFIED by a native speaker.

languages:
  en:
    digits: [zero, one, two, three, four, five, six, seven, eight, nine]
    plus: plus
    point: point
    months: [January, February, March, April, May, June, July, August, September, October, November, December]
    rupee: [rupee, rupees]
    cent: [cent, cents]
    percent: percent
    percent_position: after
    meridiem: {am: "A M", pm: "P M"}
    oclock: "o'clock"
    oh: oh
    hundred: hundred
    time_context: [at, from, until, till, by, to, before, after, between, and]
    digit_context: [otp, code, pin, account, reference, ref, number, no]
    units:
      GB: [gigabyte, gigabytes]
      MB: [megabyte, megabytes]
      KB: [kilobyte, kilobytes]
      TB: [terabyte, terabytes]
      Gbps: [gigabit per second, gigabits per second]
      Mbps: [megabit per second, megabits per second]
      Kbps: [kilobit per second, kilobits per second]
      kbps: [kilobit per second, kilobits per second]
    abbreviations:
      "SLT": "S L T"
      "PEOTV": "P E O T V"
      "LTE": "L T E"
      "VAS": "V A S"
      "SMS": "S M S"
      "OTP": "O T P"
      "FTTH": "F T T H"
      "IDD": "I D D"
      "ADSL": "A D S L"
      "SIM": "S I M"
      "2G": "two G"
      "3G": "three G"
      "4G": "four G"
      "5G": "five G"
    words: {}

