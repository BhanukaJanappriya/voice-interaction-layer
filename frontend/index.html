<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLT Mobitel Voice Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="brand">
    <img class="brand-logo" src="assets/mobitel-logo.png" alt="SLT Mobitel">
    <p class="brand-tagline">Real time multilingual voice assistant</p>
  </header>

  <div id="bot-avatar" class="bot state-idle" aria-hidden="true">
    <div class="bot-ring"></div>
    <div class="bot-face">
      <div class="bot-eye bot-eye-left"></div>
      <div class="bot-eye bot-eye-right"></div>
      <div class="bot-mouth"></div>
    </div>
    <div class="bot-waves">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <main class="card">
    <section class="field-row">
      <div class="field">
        <label for="language-select">Language</label>
        <select id="language-select">
          <option value="">Auto detect</option>
          <option value="en">English</option>
          <option value="si">Sinhala</option>
          <option value="ta">Tamil</option>
        </select>
      </div>
    </section>

    <button id="mic-button" class="mic-button" type="button">
      <span id="mic-icon" class="mic-icon">&#127908;</span>
      <span id="mic-label">Start conversation</span>
    </button>

    <section class="status-row">
      <div class="status-indicator">
        <span id="status-dot" class="status-dot status-idle"></span>
        <span id="status-text">Idle</span>
      </div>
      <div class="badges">
        <span id="language-badge" class="badge badge-muted">Language: &mdash;</span>
        <span id="mode-badge" class="badge badge-muted">Agent mode: &mdash;</span>
      </div>
    </section>

    <details class="advanced">
      <summary>Advanced</summary>
      <div class="field">
        <label for="backend-url">Backend WebSocket URL</label>
        <input id="backend-url" type="text" value="ws://localhost:8000/ws/voice">
      </div>
    </details>
  </main>

  <section class="card transcript-card">
    <h2 class="transcript-title">Conversation</h2>
    <div id="transcript" class="transcript">
      <p class="hint">Press "Start conversation", allow microphone access, and speak.
      Your words and the assistant's replies will appear here as they happen.</p>
    </div>
  </section>

  <footer class="page-footer">
    <p id="connection-note">Not connected.</p>
    <p class="footer-credit">SLT Digital Lab &mdash; voice interaction prototype</p>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
